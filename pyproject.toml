[project]
name = "agenticcfd-sdk"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "cadquery>=2.7.0",
    "claude-agent-sdk>=0.1.68",
    "fastapi>=0.136.1",
    "filetype>=1.2.0",
    "gmsh>=4.15.2",
    "httpx>=0.28.1",
    "kaleido>=1.3.0",
    "lxml>=6.1.1",
    "manifold3d>=3.5.1",
    "markdownify>=1.2.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pdfplumber>=0.11.9",
    "plotly>=6.8.0",
    "protego>=0.6.1",
    "pymeshfix>=0.18.1",
    "pymeshlab>=2025.7.post1",
    "pypandoc-binary>=1.17",
    "pypdf>=6.13.2",
    "pyvista>=0.48.4",
    "scipy>=1.15.3",
    "sdf",
    "sse-starlette>=3.3.4",
    "trafilatura>=1.8",
    "trimesh>=4.12.2",
    "uvicorn>=0.46.0",
    "weasyprint>=69.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
# Make `from src.X import Y` resolve from the repo root when running
# pytest. The project doesn't ship as an installable package, so we
# rely on the path injection rather than `pip install -e .`.
pythonpath = ["."]
markers = [
    "paraview: tests that require a live ParaView install. Auto-skipped when the bridge can't be reached.",
]

[tool.uv.sources]
sdf = { git = "https://github.com/fogleman/sdf" }
